<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6CF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Check">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Daily Checking for my life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one-screen phone app — routine stickers on top, calendar below, Month/Week tab bar fixed at the bottom. Single warm light look by choice. */
:root{
  --bg:#FFF6CF;          /* light butter yellow */
  --paper:#FFFCEE;
  --ink:#5A4636;
  --muted:#A48F79;
  --line:#EFDDA6;
  --accent:#FF9DB4;
  --accent-ink:#C24468;
  --check:#EB4458;
  --today:#FFE07A;
  --sat:#6C9BD8;
  --sun:#E4708A;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
b,strong,h1,h2,.nm,.wk-row-label,.hint button,.field input[type=text]{font-weight:400!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.app-title{font-family:var(--display);font-size:26px;text-align:center;margin:4px 0 0;letter-spacing:.5px}
.app-title small{display:block;font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}

.chip{font-family:var(--display);font-size:17px;border:2.5px solid var(--ink);border-radius:12px 14px 11px 15px;padding:3px 10px;background:var(--paper);display:inline-block;line-height:1.2}
.row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-head .grow{flex:1}
.today-label{font-family:var(--display);font-size:17px}
.today-label b{background:var(--today);border-radius:10px;padding:1px 8px;font-weight:400}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);position:relative}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-family:var(--display);font-size:12px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* routine stickers */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.card{position:relative}
.card .tap{width:100%;min-height:92px;border-radius:20px 22px 18px 24px;background:var(--paper);border:2.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;transition:transform .15s,background .2s}
.card .tap:active{transform:scale(.95)}
.card .tap .ico{font-size:32px;line-height:1;width:38px;height:38px;display:grid;place-items:center}
.card .tap .ico img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.card .tap .nm{font-weight:700;font-size:17px;text-align:center;word-break:keep-all;overflow-wrap:anywhere;line-height:1.1}
.card .tap .ico{filter:grayscale(.55);opacity:.75;transition:filter .2s,opacity .2s}
.card.done .tap{background:var(--c);border:2.5px solid var(--ink)}
.card.done .tap .ico{filter:none;opacity:1}
.card .stamp{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--check);color:#fff;display:none;place-items:center;transform:rotate(-12deg)}
.card.done .stamp{display:grid}
.card .stamp svg{width:15px;height:15px}
.card .edit{position:absolute;right:2px;top:2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.card .edit svg{width:17px;height:17px}
.card.add .tap{border-style:dashed;border-color:var(--accent);color:var(--accent-ink);font-family:var(--display)}
.card.add .tap .plus{font-size:34px;line-height:1}
.hint{background:var(--paper);border:2px dashed var(--accent);border-radius:14px;padding:8px 12px;font-size:16px;display:flex;gap:8px;align-items:flex-start}
.hint p{margin:0;flex:1}
.hint button{color:var(--accent-ink);font-weight:700}
.divider{height:3px;border-radius:3px;background:var(--line)}

/* month calendar */
.month-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.month-nav span{font-family:var(--display);font-size:18px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.month-nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-family:var(--display)}
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{text-align:center;font-family:var(--display);font-size:16px;color:var(--muted)}
.dow div:nth-child(6),.wk-head .d:nth-child(7) .l{color:var(--sat)}
.dow div:nth-child(7),.wk-head .d:nth-child(8) .l{color:var(--sun)}
.cal .cell{min-height:64px;border-radius:12px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,252,238,.6)}
.cal .cell.empty{background:none}
.cal .num{font-family:var(--display);font-size:15px;line-height:1;font-variant-numeric:tabular-nums;width:24px;height:22px;display:grid;place-items:center;border-radius:9px}
.cal .cell.sat .num{color:var(--sat)}
.cal .cell.sun .num{color:var(--sun)}
.cal .cell.today{background:var(--paper);outline:2.5px solid var(--ink)}
.cal .cell.today .num{background:var(--today);color:var(--ink)}
.cal .icons{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 2px;max-width:100%}
.cal .icons span{font-size:13px;line-height:1.1}
.cal .icons img{width:14px;height:14px;border-radius:50%;object-fit:cover}

/* week view */
.wk{display:flex;flex-direction:column;gap:8px}
.wk-grid{display:grid;grid-template-columns:84px repeat(7,minmax(0,1fr));gap:4px 3px;align-items:center}
.wk-head{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px 20px 15px 22px;padding:6px 4px}
.wk-head .d{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.wk-head .d .l{font-family:var(--display);font-size:13px;color:var(--muted)}
.wk-head .d .n{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;padding:2px 3px;border-radius:8px}
.wk-head .d.today .n{background:var(--today)}
.wk-row-label{display:flex;align-items:center;gap:4px;min-width:0;font-size:13px;line-height:1.15;padding-block:3px}
.wk-row-label .ico{font-size:16px;flex:none;width:20px;text-align:center}
.wk-row-label .ico img{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block}
.wk-row-label .t{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.wk-cell{height:100%;min-height:40px;border-radius:10px;display:grid;place-items:center;border-bottom:2px dotted var(--line)}
.wk-cell:disabled{cursor:default;opacity:.35}
.wk-cell.today{background:rgba(255,224,122,.35)}
.wk-cell svg{width:26px;height:26px;color:var(--check);transform:scale(0);transition:transform .18s cubic-bezier(.3,1.6,.6,1)}
.wk-cell.on svg{transform:scale(1) rotate(-6deg)}
.empty-note{text-align:center;color:var(--muted);padding:24px 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:5}
.tabs button{font-family:var(--display);font-size:22px;padding:8px 0;border-radius:16px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}

/* bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(90,70,54,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;border:3px solid var(--ink);border-bottom:0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-family:var(--display);font-size:15px;color:var(--muted)}
.field input[type=text]{font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:14px;border:2.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
.err{color:var(--accent-ink);font-size:16px;margin:0}
.icon-pick{display:flex;gap:12px;align-items:center}
.big-ico{width:72px;height:72px;flex:none;border-radius:22px;background:var(--c,#FFD6E0);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:40px;overflow:hidden}
.big-ico img{width:100%;height:100%;object-fit:cover}
.icon-actions{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.icon-actions input[type=text]{font-size:22px;padding:6px 10px;text-align:center}
.pill{font-family:var(--display);font-size:15px;padding:8px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line);text-align:center}
.pill-row{display:flex;gap:8px}
.pill-row .pill{flex:1}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emoji-grid button{font-size:24px;height:42px;border-radius:12px}
.emoji-grid button.sel{background:var(--today)}
.sheet-actions{display:flex;gap:10px}
.btn{flex:1;font-family:var(--display);font-size:18px;padding:12px;border-radius:16px;border:2.5px solid var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-ink)}
.btn.ghost{background:var(--paper)}
.btn.warn{background:none;border:2px dashed var(--line);color:var(--accent-ink);font-size:16px;padding:10px}
.trash-list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.trash-list li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px}
.trash-list .ico{font-size:28px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.trash-list .ico img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.trash-list .info{flex:1;min-width:0}
.trash-list .info b{display:block;font-size:18px;overflow-wrap:anywhere}
.trash-list .info span{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.trash-list .acts{display:flex;flex-direction:column;gap:4px}
.trash-list .acts button{font-family:var(--display);font-size:13px;padding:5px 8px;border-radius:10px;background:var(--paper);border:2px solid var(--line);white-space:nowrap}
.trash-list .acts button.armed{background:var(--check);color:#fff;border-color:var(--check)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:14px;font-size:16px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* base reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,label{touch-action:manipulation}
.note{margin:0;font-size:15px;color:var(--muted);line-height:1.45}
label.btn{display:block;text-align:center;cursor:pointer}
.confirm-box{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm-box p{margin:0}
</style>
</head>
<body>

<div class="app">
  <h1 class="app-title">Daily Checking for my life</h1>

  <main id="monthView" class="app" style="padding:0;gap:18px">
    <section class="row-head" aria-label="오늘의 루틴">
      <span class="chip">My Routines</span>
      <span class="today-label" id="todayLabel">Today</span>
      <span class="grow"></span>
      <button class="icon-btn" id="backupBtn" aria-label="백업">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 11v8M9 16l3 3 3-3"/></svg>
      </button>
      <button class="icon-btn" id="trashBtn" aria-label="휴지통 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a2 2 0 0 0 2 1.5h7a2 2 0 0 0 2-1.5L18.5 7M9 7V4.5h6V7"/></svg>
        <span class="badge" id="trashCount" hidden></span>
      </button>
    </section>
    <div id="hint" class="hint" hidden><p>지금 보이는 루틴은 예시예요. 연필 버튼으로 이름과 아이콘을 바꾸거나 지울 수 있어요.</p><button id="hintClose">알겠어요</button></div>
    <div class="cards" id="cards"></div>

    <div class="divider"></div>

    <section class="row-head" aria-label="달력">
      <span class="chip">Month</span>
      <div class="month-nav">
        <button id="prevM" aria-label="이전 달">‹</button>
        <span id="monthLabel"></span>
        <button id="nextM" aria-label="다음 달">›</button>
      </div>
    </section>
    <div>
      <div class="dow"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
      <div class="cal" id="cal" style="margin-top:6px"></div>
    </div>
  </main>

  <main id="weekView" class="app" style="padding:0;gap:22px" hidden></main>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tabMonth" aria-selected="true">Month</button>
  <button role="tab" id="tabWeek" aria-selected="false">Week</button>
</nav>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='daily-checking-v1';
const COLORS=['#FFD6E0','#CDE8FF','#D3F3DA','#E6DAFF','#FFE2C4','#FFF0A0','#CFF0EC','#FBD3F0'];
const CUTE=['🌷','🍓','🐣','⭐','🍀','🫧','🧸','🌈','🍑','🐰','🌼','🍒','🐥','🦋','🍋','🐻'];
const RULES=[
 [/식물|화분|꽃/,'🪴'],[/물|water/i,'💧'],[/스트레칭|요가|필라테스/,'🧘'],[/운동|헬스|근력|홈트|gym/i,'💪'],
 [/달리기|러닝|조깅|run/i,'🏃'],[/산책|걷기|만보|walk/i,'🚶'],[/책|독서|읽기/,'📚'],[/약|영양제|비타민|유산균/,'💊'],
 [/명상|호흡/,'🌿'],[/일기|기록|저널|다이어리/,'📔'],[/영어|일본어|중국어|외국어|단어|회화/,'🔤'],[/공부|강의|수업|과제/,'✏️'],
 [/잠|수면|취침|일찍 자/,'😴'],[/기상|아침|일찍 일어/,'🌞'],[/청소|정리|빨래/,'🧹'],[/요리|밥|아침밥|식사/,'🍳'],
 [/커피/,'☕'],[/피아노|기타|악기|노래|음악/,'🎵'],[/그림|드로잉|스케치/,'🎨'],[/스킨|세안|팩|피부|선크림/,'🧴'],
 [/양치|치실/,'🪥'],[/과일|채소|샐러드|야채/,'🥗'],[/저축|가계부|돈|지출/,'💰'],[/연락|전화|부모님|안부/,'💌'],
 [/고양이|냥/,'🐱'],[/강아지|멍/,'🐶'],[/핸드폰|폰|sns|유튜브/i,'📵'],[/감사/,'🙏'],[/계획|할 일|투두/,'📝']
];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const dotted=k=>k.replace(/-/g,'.');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firstGrapheme=s=>{s=s.trim();if(!s)return '';try{return [...new Intl.Segmenter('ko',{granularity:'grapheme'}).segment(s)][0].segment}catch(e){return [...s][0]}};
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L20 6"/></svg>';
const PENCIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>';

let now=new Date(), todayKey=keyOf(now);
let viewMonth=new Date(now.getFullYear(),now.getMonth(),1);
let state, storageOk=true;

function seed(){
  const ex=[['물 마시기','💧'],['스트레칭','🧘'],['책 읽기','📚'],['영양제','💊']];
  return {routines:ex.map((e,i)=>({id:'ex'+i,name:e[0],icon:{type:'emoji',value:e[1]},color:COLORS[i],created:todayKey,deleted:null})),checks:{},hint:true};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.routines))return s}}catch(e){storageOk=false}
  return seed();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch(e){if(storageOk){storageOk=false;toast('이 브라우저에서는 기록을 저장할 수 없어요. 다른 브라우저로 열어 주세요.')}}
}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

const active=()=>state.routines.filter(r=>!r.deleted);
const byId=id=>state.routines.find(r=>r.id===id);
const isOn=(k,id)=>(state.checks[k]||[]).includes(id);
function toggle(k,id){
  const a=state.checks[k]||[];const i=a.indexOf(id);
  if(i>=0)a.splice(i,1);else a.push(id);
  if(a.length)state.checks[k]=a;else delete state.checks[k];
  save();renderAll();
}
function iconHTML(ic){return ic&&ic.type==='img'?'<img src="'+esc(ic.value)+'" alt="">':esc(ic?ic.value:'⭐')}
function suggest(name,exclude){
  for(const [re,e] of RULES)if(re.test(name))return e;
  const used=new Set(state.routines.filter(r=>!r.deleted&&r.id!==exclude&&r.icon.type==='emoji').map(r=>r.icon.value));
  const pool=CUTE.filter(e=>!used.has(e));const p=pool.length?pool:CUTE;
  return p[Math.floor(Math.random()*p.length)];
}

/* ---------- Month view ---------- */
function renderToday(){
  $('#todayLabel').innerHTML='Today <b>'+(now.getMonth()+1)+'/'+now.getDate()+'</b>';
  const list=active();
  let h='';
  for(const r of list){
    const on=isOn(todayKey,r.id);
    h+='<div class="card'+(on?' done':'')+'" style="--c:'+esc(r.color)+'">'+
      '<button class="tap" data-t="'+esc(r.id)+'" aria-pressed="'+on+'"><span class="ico">'+iconHTML(r.icon)+'</span><span class="nm">'+esc(r.name)+'</span></button>'+
      '<span class="stamp" aria-hidden="true">'+CHECK_SVG+'</span>'+
      '<button class="edit" data-e="'+esc(r.id)+'" aria-label="'+esc(r.name)+' 수정">'+PENCIL+'</button></div>';
  }
  h+='<div class="card add"><button class="tap" id="addBtn"><span class="plus">+</span><span>루틴 추가</span></button></div>';
  $('#cards').innerHTML=h;
  const trashN=state.routines.filter(r=>r.deleted).length;
  const b=$('#trashCount');b.hidden=!trashN;b.textContent=trashN;
  $('#hint').hidden=!(state.hint&&state.routines.some(r=>r.id.startsWith('ex')));
}
function renderCalendar(){
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth();
  $('#monthLabel').textContent=y+'. '+pad(m+1);
  const lead=(viewMonth.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  let h='';
  for(let i=0;i<lead;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m,d),k=keyOf(dt),dow=(dt.getDay()+6)%7;
    const ids=state.checks[k]||[];
    const icons=ids.map(byId).filter(Boolean).map(r=>'<span title="'+esc(r.name)+'">'+iconHTML(r.icon)+'</span>').join('');
    h+='<div class="cell'+(k===todayKey?' today':'')+(dow===5?' sat':'')+(dow===6?' sun':'')+'"><span class="num">'+d+'</span><div class="icons">'+icons+'</div></div>';
  }
  $('#cal').innerHTML=h;
}

/* ---------- Week view ---------- */
function renderWeek(){
  const thisMon=mondayOf(now);
  const blocks=[['Last week',addDays(thisMon,-7)],['This week',thisMon]];
  const list=active();
  const L=['M','T','W','T','F','S','S'];
  let h='';
  for(const [label,mon] of blocks){
    h+='<section class="wk"><span class="chip" style="align-self:flex-start">'+label+'</span>';
    h+='<div class="wk-grid wk-head"><div></div>';
    for(let i=0;i<7;i++){
      const d=addDays(mon,i),k=keyOf(d);
      const n=(i===0||d.getDate()===1)?(d.getMonth()+1)+'/'+d.getDate():d.getDate();
      h+='<div class="d'+(k===todayKey?' today':'')+'"><span class="l">'+L[i]+'</span><span class="n">'+n+'</span></div>';
    }
    h+='</div>';
    if(!list.length){h+='<p class="empty-note">등록된 루틴이 없어요. Month 화면에서 + 로 추가해 주세요.</p></section>';continue}
    h+='<div class="wk-grid">';
    for(const r of list){
      h+='<div class="wk-row-label"><span class="ico">'+iconHTML(r.icon)+'</span><span class="t">'+esc(r.name)+'</span></div>';
      for(let i=0;i<7;i++){
        const d=addDays(mon,i),k=keyOf(d),on=isOn(k,r.id),fut=k>todayKey;
        h+='<button class="wk-cell'+(on?' on':'')+(k===todayKey?' today':'')+'" data-k="'+k+'" data-id="'+esc(r.id)+'"'+(fut?' disabled':'')+' aria-pressed="'+on+'" aria-label="'+esc(r.name)+' '+dotted(k)+'">'+CHECK_SVG+'</button>';
      }
    }
    h+='</div></section>';
  }
  $('#weekView').innerHTML=h;
}
function renderAll(){renderToday();renderCalendar();renderWeek()}

/* ---------- Sheets ---------- */
let draft=null;
function openSheet(html){$('#sheet').innerHTML=html;$('#overlay').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('#overlay').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';draft=null}

function openEdit(id){
  const r=id?byId(id):null;
  draft={id:id||null,name:r?r.name:'',icon:r?{...r.icon}:{type:'emoji',value:suggest('')},touched:!!r,
         color:r?r.color:COLORS[state.routines.length%COLORS.length]};
  const grid=CUTE.map(e=>'<button type="button" data-em="'+e+'">'+e+'</button>').join('');
  openSheet(
   '<h2>'+(r?'루틴 수정':'새 루틴')+'</h2>'+
   '<div class="field"><label for="rName">루틴 이름</label><input type="text" id="rName" maxlength="20" placeholder="예: 물 2L 마시기" value="'+esc(draft.name)+'"><p class="err" id="rErr" hidden>루틴 이름을 적어 주세요.</p></div>'+
   '<div class="field"><span class="lab">아이콘</span><div class="icon-pick">'+
     '<div class="big-ico" id="bigIco" style="--c:'+esc(draft.color)+'"></div>'+
     '<div class="icon-actions"><input type="text" id="rEmoji" aria-label="이모티콘 직접 입력" placeholder="이모티콘 입력">'+
     '<div class="pill-row"><label class="pill" for="rPhoto" tabindex="0">사진 등록</label><button type="button" class="pill" id="rSuggest">추천 받기</button></div>'+
     '<input type="file" id="rPhoto" accept="image/*" hidden></div></div>'+
     '<div class="emoji-grid" id="emGrid">'+grid+'</div></div>'+
   '<div class="sheet-actions"><button class="btn ghost" id="sCancel">취소</button><button class="btn primary" id="sSave">저장</button></div>'+
   (r?'<button class="btn warn" id="sDelete">휴지통으로 보내기</button>':'')
  );
  paintIcon();
  const nameEl=$('#rName');
  nameEl.addEventListener('input',()=>{draft.name=nameEl.value;$('#rErr').hidden=true;
    if(!draft.touched){const s=suggest(draft.name,draft.id);if(s!==draft.icon.value&&RULES.some(([re])=>re.test(draft.name))){draft.icon={type:'emoji',value:s};paintIcon()}}});
  $('#rEmoji').addEventListener('input',e=>{const g=firstGrapheme(e.target.value);if(g){draft.icon={type:'emoji',value:g};draft.touched=true;paintIcon()}});
  $('#emGrid').addEventListener('click',e=>{const b=e.target.closest('[data-em]');if(!b)return;draft.icon={type:'emoji',value:b.dataset.em};draft.touched=true;paintIcon()});
  $('#rSuggest').addEventListener('click',()=>{let s=suggest(draft.name,draft.id),n=0;while(s===draft.icon.value&&n++<8)s=suggest('',draft.id);draft.icon={type:'emoji',value:s};draft.touched=true;paintIcon()});
  document.querySelector('label[for="rPhoto"]').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#rPhoto').click()}});
  $('#rPhoto').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
      const S=96,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
      const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      draft.icon={type:'img',value:c.toDataURL('image/jpeg',.85)};draft.touched=true;paintIcon()};
      img.onerror=()=>toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.');img.src=rd.result};rd.readAsDataURL(f)});
  $('#sCancel').addEventListener('click',closeSheet);
  $('#sSave').addEventListener('click',saveDraft);
  nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')saveDraft()});
  if(r)$('#sDelete').addEventListener('click',()=>{r.deleted=todayKey;save();closeSheet();renderAll();toast('“'+r.name+'” 루틴을 휴지통으로 옮겼어요.')});
  if(!r)setTimeout(()=>nameEl.focus(),50);
}
function paintIcon(){
  const b=$('#bigIco');if(!b)return;b.innerHTML=iconHTML(draft.icon);
  document.querySelectorAll('#emGrid [data-em]').forEach(x=>x.classList.toggle('sel',draft.icon.type==='emoji'&&x.dataset.em===draft.icon.value));
}
function saveDraft(){
  const name=$('#rName').value.trim();
  if(!name){$('#rErr').hidden=false;$('#rName').focus();return}
  if(draft.id){const r=byId(draft.id);r.name=name;r.icon=draft.icon}
  else state.routines.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,icon:draft.icon,color:draft.color,created:todayKey,deleted:null});
  const wasNew=!draft.id;save();closeSheet();renderAll();toast(wasNew?'루틴을 추가했어요.':'수정했어요.');
}

function openTrash(){
  const del=state.routines.filter(r=>r.deleted).sort((a,b)=>b.deleted.localeCompare(a.deleted));
  let h='<h2>휴지통</h2>';
  if(!del.length)h+='<p class="empty-note">지운 루틴이 없어요.</p>';
  else{
    h+='<ul class="trash-list">';
    for(const r of del)h+='<li><span class="ico">'+iconHTML(r.icon)+'</span><div class="info"><b>'+esc(r.name)+'</b><span>'+dotted(r.created)+' → '+dotted(r.deleted)+'</span></div>'+
      '<div class="acts"><button data-restore="'+esc(r.id)+'">되돌리기</button><button data-purge="'+esc(r.id)+'">영구 삭제</button></div></li>';
    h+='</ul>';
  }
  h+='<div class="sheet-actions"><button class="btn ghost" id="sCancel">닫기</button></div>';
  openSheet(h);
  $('#sCancel').addEventListener('click',closeSheet);
  $('#sheet').addEventListener('click',e=>{
    const rs=e.target.closest('[data-restore]'),pg=e.target.closest('[data-purge]');
    if(rs){const r=byId(rs.dataset.restore);r.deleted=null;save();renderAll();openTrash();toast('“'+r.name+'” 루틴을 되돌렸어요.')}
    if(pg){
      if(!pg.classList.contains('armed')){pg.classList.add('armed');pg.textContent='한 번 더 누르면 삭제';return}
      const id=pg.dataset.purge;state.routines=state.routines.filter(r=>r.id!==id);
      for(const k in state.checks){state.checks[k]=state.checks[k].filter(x=>x!==id);if(!state.checks[k].length)delete state.checks[k]}
      save();renderAll();openTrash();toast('기록까지 모두 지웠어요.');
    }
  });
}

/* ---------- Backup ---------- */
function openBackup(){
  const last=state.lastBackup?dotted(state.lastBackup):'아직 없음';
  openSheet('<h2>백업</h2>'+
    '<p class="note">기록은 이 폰 안에만 저장돼요. 가끔 백업 파일을 저장해 두면 폰을 바꾸거나 데이터가 지워져도 되살릴 수 있어요.</p>'+
    '<p class="note">마지막 백업: '+last+'</p>'+
    '<button class="btn primary" id="bkSave">백업 파일 저장</button>'+
    '<label class="btn ghost" for="bkFile" tabindex="0">백업 불러오기</label>'+
    '<input type="file" id="bkFile" accept=".json,application/json" hidden>'+
    '<p class="err" id="bkMsg" hidden></p>'+
    '<div class="confirm-box" id="bkConfirm" hidden><p id="bkText"></p><div class="sheet-actions"><button class="btn ghost" id="bkNo">취소</button><button class="btn primary" id="bkYes">바꾸기</button></div></div>'+
    '<div class="sheet-actions"><button class="btn ghost" id="sCancel">닫기</button></div>');
  $('#sCancel').addEventListener('click',closeSheet);
  $('#bkSave').addEventListener('click',async()=>{
    state.lastBackup=todayKey;save();
    const name='daily-checking-'+todayKey.replace(/-/g,'')+'.json';
    const blob=new Blob([JSON.stringify({app:'daily-checking',version:1,exportedAt:new Date().toISOString(),state})],{type:'application/json'});
    const file=new File([blob],name,{type:'application/json'});
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'루틴 백업'});toast('백업 파일을 보냈어요.');closeSheet();return}catch(e){if(e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast('“'+name+'” 파일을 저장했어요.');closeSheet();
  });
  document.querySelector('label[for="bkFile"]').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#bkFile').click()}});
  let pending=null;
  $('#bkFile').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;const msg=$('#bkMsg');msg.hidden=true;
    f.text().then(t=>{
      const o=JSON.parse(t);const s=o&&o.state;
      if(!s||!Array.isArray(s.routines)||typeof s.checks!=='object')throw 0;
      pending=s;
      $('#bkText').textContent=(o.exportedAt?o.exportedAt.slice(0,10).replace(/-/g,'.')+' 백업':'이 백업')+'(루틴 '+s.routines.length+'개, 기록 '+Object.keys(s.checks).length+'일)으로 지금 기록을 바꿀까요? 지금 기록은 사라져요.';
      $('#bkConfirm').hidden=false;
    }).catch(()=>{msg.textContent='이 파일은 루틴 백업 파일이 아니에요. daily-checking-날짜.json 파일을 골라 주세요.';msg.hidden=false});
    e.target.value='';
  });
  $('#bkNo').addEventListener('click',()=>{pending=null;$('#bkConfirm').hidden=true});
  $('#bkYes').addEventListener('click',()=>{if(!pending)return;state=pending;state.hint=false;save();closeSheet();renderAll();toast('백업으로 되돌렸어요.')});
}

/* ---------- Events ---------- */
$('#cards').addEventListener('click',e=>{
  const ed=e.target.closest('[data-e]');if(ed){openEdit(ed.dataset.e);return}
  if(e.target.closest('#addBtn')){openEdit(null);return}
  const t=e.target.closest('[data-t]');if(t)toggle(todayKey,t.dataset.t);
});
$('#weekView').addEventListener('click',e=>{const c=e.target.closest('.wk-cell');if(c&&!c.disabled)toggle(c.dataset.k,c.dataset.id)});
$('#trashBtn').addEventListener('click',openTrash);
$('#backupBtn').addEventListener('click',openBackup);
$('#hintClose').addEventListener('click',()=>{state.hint=false;save();renderToday()});
$('#prevM').addEventListener('click',()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCalendar()});
$('#nextM').addEventListener('click',()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCalendar()});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet()});
function setView(v){
  $('#monthView').hidden=v!=='month';$('#weekView').hidden=v!=='week';
  $('#tabMonth').setAttribute('aria-selected',v==='month');$('#tabWeek').setAttribute('aria-selected',v==='week');
  window.scrollTo(0,0);
}
$('#tabMonth').addEventListener('click',()=>setView('month'));
$('#tabWeek').addEventListener('click',()=>setView('week'));

/* 날짜가 바뀌면 Today 자동 갱신 */
function tick(){const n=new Date();if(keyOf(n)!==todayKey){const sameMonth=viewMonth.getFullYear()===now.getFullYear()&&viewMonth.getMonth()===now.getMonth();now=n;todayKey=keyOf(n);if(sameMonth)viewMonth=new Date(n.getFullYear(),n.getMonth(),1);renderAll()}}
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

state=load();
renderAll();setView('month');

/* 오프라인 실행 + 저장공간 보호 */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
</body>
